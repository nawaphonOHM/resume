<a class="skip-link" href="#main-content">Skip to main content</a>

<app-resume-navigation
  [activeSection]="activeSection()"
  [theme]="theme()"
  (sectionSelected)="selectSection($event)"
  (themeToggled)="toggleTheme()"
  (printRequested)="printResume()"
/>

<main id="main-content" tabindex="-1">
  <div class="mx-auto w-full max-w-resume px-4 sm:px-6 lg:px-8">
    <app-hero-section [profile]="resume" />
    <app-summary-section [summary]="resume.summary" />
    <app-experience-timeline [experience]="resume.experience" />
    <app-profile-sidebar [profile]="resume" />
  </div>
</main>

<footer>
  <div
    class="mx-auto flex w-full max-w-resume flex-col gap-1 px-4 py-8 sm:px-6 md:flex-row md:items-center md:justify-between lg:px-8"
  >
    <p>{{ resume.name }} · {{ resume.title }}</p>
    <p>{{ resume.details.location }}</p>
  </div>
</footer>
