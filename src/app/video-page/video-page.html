<main
  appMainContentDirective
  class="video-page"
  id="video-page-main"
  tabindex="-1"
  aria-labelledby="video-page-title"
>
  <section class="video-page__content" aria-describedby="video-page-description">
    <h1 id="video-page-title">A video break</h1>
    <p id="video-page-description">
      This video will attempt to play automatically. If playback does not start, use the player
      controls.
    </p>

    <div
      appPlayerHostDirective
      class="video-page__frame"
      [style.height.px]="canRenderPlayer() ? playerHeight() : 0"
    >
      @if (canRenderPlayer()) {
        <youtube-player
          [videoId]="videoId"
          [disablePlaceholder]="true"
          [width]="playerWidth()"
          [height]="playerHeight()"
          (ready)="handlePlayerReady($event)"
        ></youtube-player>
      }
    </div>

    <p class="video-page__fallback">
      If the embedded player is unavailable,
      <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">watch the video on YouTube</a>.
    </p>

    <a class="video-page__resume-link" routerLink="/">Return to the résumé</a>
  </section>
</main>
