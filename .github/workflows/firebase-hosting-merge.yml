name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Validate code is properly prettier-format
        run: npm run check-format

      - name: Validate code is properly linted
        run: npm run lint

      - name: Tests
        run: npm run test:ci

      - name: Build Angular
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESUME_3E05F }}
          channelId: live
          projectId: resume-3e05f
